<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Botrix — Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">B</span>
        <span class="brand-name">botrix</span>
      </div>
      <div class="topbar-right">
        <span class="bot-status" id="botStatus">
          <span class="dot dot--on"></span> Bot aktif
        </span>
      </div>
    </header>

    <section class="greeting">
      <h1 id="greetingText">Merhaba <span id="userName">—</span> <span class="wave">👋</span></h1>
      <p class="subline" id="businessLine">İşletme yükleniyor…</p>
    </section>

    <section class="stat-grid" id="statGrid">
      <!-- stat card'lar JS ile dolduruluyor -->
    </section>

    <section class="board">
      <div class="calendar-card">
        <div class="calendar-header">
          <div>
            <p class="eyebrow">Takvim</p>
            <h2 id="monthLabel">—</h2>
          </div>
          <div class="calendar-nav">
            <button id="prevMonth" aria-label="Önceki ay">‹</button>
            <button id="todayBtn">Bugün</button>
            <button id="nextMonth" aria-label="Sonraki ay">›</button>
          </div>
        </div>
        <div class="weekday-row">
          <span>Pt</span><span>Sa</span><span>Ça</span><span>Pe</span><span>Cu</span><span>Ct</span><span>Pz</span>
        </div>
        <div class="day-grid" id="dayGrid"></div>
        <div class="legend">
          <span><i class="legend-dot legend-dot--onaylandi"></i>Onaylandı</span>
          <span><i class="legend-dot legend-dot--beklemede"></i>Beklemede</span>
          <span><i class="legend-dot legend-dot--iptal"></i>İptal</span>
        </div>
      </div>

      <div class="appointments-card">
        <div class="appointments-header">
          <p class="eyebrow">Randevular</p>
          <h2 id="selectedDateLabel">—</h2>
        </div>
        <div class="appointments-list" id="appointmentsList">
          <p class="empty-state">Yükleniyor…</p>
        </div>
      </div>
    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
